apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-microservice
  labels:
    name: rabbitmq-microservice
  namespace: ikomida
spec:
  serviceName: rabbitmq-service
  selector:
    matchLabels:
      app: rabbitmq-microservice
  template:
    metadata:
      labels:
        app: rabbitmq-microservice
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/ikomida-prod/docker/rabbitmq-image:latest
          name: rabbitmq
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom:
                secretKeyRef:
                    name: environment
                    key: MQVHOST
                    optional: false
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                    name: environment
                    key: MQUSER
                    optional: false
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                    name: environment
                    key: MQPASS
                    optional: false
          ports:
            - containerPort: 15672
              name: management
            - containerPort: 15692
              name: prometheus
            - containerPort: 5672
              name: amqp
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
# Request a persistent volume from the cluster using a Persistent Volume Claim.
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: rabbitmq-data
  namespace: ikomida
  annotations:
    volume.alpha.kubernetes.io/storage-class: default
spec:
  # storageClassName: manual
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi